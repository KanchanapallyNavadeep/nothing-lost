<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nothing Lost | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #312e81
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .auth-container {

            width: 100%;

            max-width: 440px;

            background: rgba(
                255,
                255,
                255,
                0.97
            );

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.35);

        }


        .logo {

            text-align: center;

            margin-bottom: 25px;

        }


        .logo-icon {

            font-size: 48px;

            margin-bottom: 8px;

        }


        .logo h1 {

            font-size: 30px;

            color: #111827;

        }


        .logo p {

            color: #6b7280;

            margin-top: 6px;

        }


        .tabs {

            display: flex;

            background: #f3f4f6;

            border-radius: 10px;

            padding: 4px;

            margin-bottom: 25px;

        }


        .tab {

            flex: 1;

            border: none;

            background: transparent;

            padding: 12px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        .tab.active {

            background: white;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.1);

            color: #4f46e5;

        }


        .form {

            display: none;

        }


        .form.active {

            display: block;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #374151;

        }


        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(
                    99,
                    102,
                    241,
                    0.15
                );

        }


        .auth-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

        }


        .auth-button:hover {

            background: #4338ca;

        }


        .message {

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            display: none;

            font-size: 14px;

        }


        .message.success {

            display: block;

            background: #dcfce7;

            color: #166534;

        }


        .message.error {

            display: block;

            background: #fee2e2;

            color: #991b1b;

        }


        .admin-note {

            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #eef2ff;

            color: #3730a3;

            font-size: 13px;

            text-align: center;

        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #4f46e5;

            text-decoration: none;

            font-size: 14px;

        }

    </style>

</head>


<body>


    <div class="auth-container">


        <div class="logo">

            <div class="logo-icon">
                🔐
            </div>

            <h1>
                Nothing Lost
            </h1>

            <p>
                AI Lost & Found System
            </p>

        </div>


        <!-- Login / Register tabs -->

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                onclick="showLogin()"
            >
                Login
            </button>


            <button
                class="tab"
                id="registerTab"
                onclick="showRegister()"
            >
                Register
            </button>

        </div>


        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            class="form active"
            onsubmit="loginUser(event)"
        >

            <div class="form-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>


        <!-- REGISTER FORM -->

        <form
            id="registerForm"
            class="form"
            onsubmit="registerUser(event)"
        >

            <div class="form-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>

        </form>


        <!-- Status message -->

        <div
            id="authMessage"
            class="message"
        ></div>


        <div class="admin-note">

            🛡️ Admin accounts are controlled
            separately for security.

        </div>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Nothing Lost
        </a>


    </div>


    <script>


        // ----------------------------------------
        // SWITCH TO LOGIN
        // ----------------------------------------

        function showLogin() {

            document
                .getElementById("loginForm")
                .classList.add("active");


            document
                .getElementById("registerForm")
                .classList.remove("active");


            document
                .getElementById("loginTab")
                .classList.add("active");


            document
                .getElementById("registerTab")
                .classList.remove("active");


            clearMessage();

        }


        // ----------------------------------------
        // SWITCH TO REGISTER
        // ----------------------------------------

        function showRegister() {

            document
                .getElementById("registerForm")
                .classList.add("active");


            document
                .getElementById("loginForm")
                .classList.remove("active");


            document
                .getElementById("registerTab")
                .classList.add("active");


            document
                .getElementById("loginTab")
                .classList.remove("active");


            clearMessage();

        }


        // ----------------------------------------
        // MESSAGE
        // ----------------------------------------

        function showMessage(
            message,
            type
        ) {

            const element =
                document.getElementById(
                    "authMessage"
                );


            element.textContent =
                message;


            element.className =
                "message " + type;

        }


        function clearMessage() {

            const element =
                document.getElementById(
                    "authMessage"
                );


            element.textContent = "";

            element.className =
                "message";

        }


        // ----------------------------------------
        // REGISTER
        // ----------------------------------------

        async function registerUser(event) {

            event.preventDefault();


            const email =
                document.getElementById(
                    "registerEmail"
                ).value.trim();


            const password =
                document.getElementById(
                    "registerPassword"
                ).value;


            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;


            // Check passwords

            if (
                password !==
                confirmPassword
            ) {

                showMessage(
                    "❌ Passwords do not match.",
                    "error"
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:8000/register",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email:
                                        email,

                                    password:
                                        password

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    showMessage(
                        "❌ " + data.message,
                        "error"
                    );

                    return;

                }


                showMessage(
                    "✅ Account created successfully. You can now login.",
                    "success"
                );


                document
                    .getElementById(
                        "registerForm"
                    )
                    .reset();


                setTimeout(
                    showLogin,
                    1500
                );


            } catch (error) {

                console.error(
                    "REGISTER ERROR:",
                    error
                );


                showMessage(
                    "❌ Could not connect to the backend.",
                    "error"
                );

            }

        }


        // ----------------------------------------
        // LOGIN
        // ----------------------------------------

        async function loginUser(event) {

            event.preventDefault();


            const email =
                document.getElementById(
                    "loginEmail"
                ).value.trim();


            const password =
                document.getElementById(
                    "loginPassword"
                ).value;


            try {

                const response =
                    await fetch(
                        "http://127.0.0.1:8000/login",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email:
                                        email,

                                    password:
                                        password

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    showMessage(
                        "❌ " + data.message,
                        "error"
                    );

                    return;

                }


                // Save logged-in user
                localStorage.setItem(
                    "nothingLostUser",
                    JSON.stringify(
                        data.user
                    )
                );


                showMessage(
                    "✅ Login successful. Redirecting...",
                    "success"
                );


                /*
                    For now both User and Admin
                    go to the main application.

                    We will create the separate
                    Admin Dashboard next.
                */

                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    1000
                );


            } catch (error) {

                console.error(
                    "LOGIN ERROR:",
                    error
                );


                showMessage(
                    "❌ Could not connect to the backend.",
                    "error"
                );

            }

        }

    </script>


</body>

</html>
